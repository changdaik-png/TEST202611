<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>스마트 메모 & Gemini 3.5 Flash-Lite</title>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-hover: #f1f5f9;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --accent: #7c3aed;
      --accent-light: #f5f3ff;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
      --radius: 12px;
      --shadow: 0 4px 20px rgba(15, 23, 42, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Malgun Gothic", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Header */
    header {
      height: 60px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.1rem;
    }

    .brand-badge {
      font-size: 0.75rem;
      background: var(--accent-light);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 600;
      border: 1px solid #ddd6fe;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .security-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      padding: 6px 12px;
      border-radius: 999px;
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
      cursor: pointer;
      transition: all 0.15s;
    }

    .security-pill.warn {
      background: #fffbeb;
      color: #b45309;
      border-color: #fde68a;
    }

    .security-pill:hover {
      opacity: 0.9;
    }

    /* Main 3-Column Layout */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 280px 1fr 400px;
      overflow: hidden;
    }

    /* Left Sidebar: Memo List */
    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-top {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .search-input {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.88rem;
      outline: none;
      background: var(--bg);
    }

    .search-input:focus {
      border-color: var(--primary);
      background: var(--surface);
    }

    .memo-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .memo-item {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s;
      position: relative;
    }

    .memo-item:hover {
      background: var(--surface-hover);
    }

    .memo-item.active {
      background: var(--primary-light);
      border-color: #bfdbfe;
    }

    .memo-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
      gap: 6px;
    }

    .memo-item-title {
      font-weight: 600;
      font-size: 0.92rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .memo-item-preview {
      font-size: 0.8rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 6px;
    }

    .memo-item-date {
      font-size: 0.72rem;
      color: #94a3b8;
    }

    /* Center: Memo Editor */
    .editor-pane {
      display: flex;
      flex-direction: column;
      background: var(--surface);
      overflow: hidden;
    }

    .editor-toolbar {
      padding: 12px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .editor-status {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .editor-actions {
      display: flex;
      gap: 8px;
    }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-ghost:hover {
      background: var(--surface-hover);
    }

    .btn-danger:hover {
      background: #fef2f2;
      color: var(--danger);
      border-color: #fecaca;
    }

    .memo-title-input {
      border: none;
      outline: none;
      font-size: 1.5rem;
      font-weight: 700;
      padding: 20px 24px 10px;
      width: 100%;
      color: var(--text);
    }

    .memo-content-input {
      flex: 1;
      border: none;
      outline: none;
      resize: none;
      padding: 10px 24px 24px;
      font-size: 1rem;
      line-height: 1.7;
      color: var(--text);
      font-family: inherit;
    }

    /* Right Pane: Gemini 3.5 Flash AI Chat */
    .ai-pane {
      background: var(--bg);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .ai-header {
      padding: 14px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .ai-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .model-select {
      font-size: 0.78rem;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      outline: none;
    }

    .quick-prompts {
      padding: 10px 14px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .chip {
      font-size: 0.76rem;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--accent-light);
      color: var(--accent);
      border: 1px solid #ddd6fe;
      cursor: pointer;
      transition: all 0.15s;
    }

    .chip:hover {
      background: #ede9fe;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      max-width: 90%;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.55;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .msg.user {
      align-self: flex-end;
      background: var(--primary);
      color: #fff;
      border-bottom-right-radius: 3px;
    }

    .msg.ai {
      align-self: flex-start;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-bottom-left-radius: 3px;
      box-shadow: var(--shadow);
    }

    .msg-actions {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed var(--border);
      display: flex;
      justify-content: flex-end;
    }

    .btn-insert {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 5px;
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid #bfdbfe;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-insert:hover {
      background: #dbeafe;
    }

    .ai-footer {
      padding: 12px 14px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .context-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .context-toggle label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
    }

    .chat-input-row {
      display: flex;
      gap: 8px;
    }

    .chat-input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
      resize: none;
      height: 44px;
      outline: none;
      font-family: inherit;
    }

    .chat-input:focus {
      border-color: var(--accent);
    }

    .btn-send {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .btn-send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Security Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      background: var(--surface);
      width: 92%;
      max-width: 480px;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
    }

    .modal h3 {
      margin-bottom: 10px;
      font-size: 1.1rem;
    }

    .modal p {
      font-size: 0.86rem;
      color: var(--text-muted);
      line-height: 1.55;
      margin-bottom: 14px;
    }

    .code-box {
      background: #0f172a;
      color: #e2e8f0;
      padding: 12px;
      border-radius: 8px;
      font-family: Consolas, monospace;
      font-size: 0.82rem;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .modal-field {
      margin-bottom: 16px;
    }

    .modal-field label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .modal-field input {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.88rem;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    @media (max-width: 960px) {
      main {
        grid-template-columns: 220px 1fr 330px;
      }
    }
    @media (max-width: 768px) {
      main {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr 1fr;
      }
      .sidebar {
        max-height: 160px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>📝 스마트 메모</span>
      <span class="brand-badge">⚡ Gemini 3.5 Flash-Lite & ChatGPT</span>
    </div>
    <div class="header-controls">
      <button id="securityBtn" class="security-pill" title="보안 연결 상태 및 설정 확인">
        🔒 <span id="securityText">보안 상태 확인 중...</span>
      </button>
    </div>
  </header>

  <main>
    <!-- 1. 메모 목록 사이드바 -->
    <aside class="sidebar">
      <div class="sidebar-top">
        <button id="newMemoBtn" class="btn-primary">+ 새 메모 작성</button>
        <input id="searchInput" type="text" class="search-input" placeholder="🔍 메모 제목·내용 검색..." />
      </div>
      <div id="memoList" class="memo-list"></div>
    </aside>

    <!-- 2. 메모 편집기 -->
    <section class="editor-pane">
      <div class="editor-toolbar">
        <span id="editorStatus" class="editor-status">자동 저장됨</span>
        <div class="editor-actions">
          <button id="pinMemoBtn" class="btn-ghost" title="상단 고정">📌 고정</button>
          <button id="exportMemoBtn" class="btn-ghost" title="텍스트 파일로 저장">💾 내보내기</button>
          <button id="deleteMemoBtn" class="btn-ghost btn-danger" title="현재 메모 삭제">🗑️ 삭제</button>
        </div>
      </div>
      <input id="memoTitle" type="text" class="memo-title-input" placeholder="메모 제목을 입력하세요..." />
      <textarea id="memoContent" class="memo-content-input" placeholder="여기에 자유롭게 메모를 작성하세요. 오른쪽의 Gemini 3.5 Flash에게 요약, 다듬기, 아이디어 확장을 요청할 수 있습니다."></textarea>
    </section>

    <!-- 3. Gemini 3.5 Flash 대화 패널 -->
    <aside class="ai-pane">
      <div class="ai-header">
        <div class="ai-title">
          <span>🤖 AI 대화</span>
        </div>
        <select id="modelSelect" class="model-select" title="AI 모델 선택">
          <optgroup label="🔵 Google Gemini">
            <option value="gemini-3.5-flash-lite" selected>⚡ Gemini 3.5 Flash-Lite (초고속·기본)</option>
            <option value="gemini-3.5-flash">Gemini 3.5 Flash</option>
            <option value="gemini-2.5-flash-lite">Gemini 2.5 Flash-Lite</option>
            <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
          </optgroup>
          <optgroup label="🟢 OpenAI ChatGPT">
            <option value="gpt-4o-mini">ChatGPT (gpt-4o-mini)</option>
            <option value="gpt-4o">ChatGPT (gpt-4o)</option>
            <option value="gpt-4.1-mini">ChatGPT (gpt-4.1-mini)</option>
          </optgroup>
        </select>
      </div>

      <div class="quick-prompts">
        <button class="chip" data-prompt="현재 메모의 핵심 내용을 보기 쉽게 요약해줘.">✨ 메모 요약</button>
        <button class="chip" data-prompt="현재 메모의 문장을 더 자연스럽고 명확하게 다듬어줘.">✍️ 문장 다듬기</button>
        <button class="chip" data-prompt="현재 메모 내용을 바탕으로 새로운 아이디어나 다음 단계를 제안해줘.">💡 아이디어 확장</button>
        <button class="chip" data-prompt="현재 메모에서 해야 할 일(To-Do 리스트)을 체크리스트 형태로 뽑아줘.">✅ 할 일 추출</button>
      </div>

      <div id="chatMessages" class="chat-messages">
        <div class="msg ai">안녕하세요! ⚡ <strong>Gemini 3.5 Flash-Lite</strong> 어시스턴트입니다. 😊
초고속 모드로 빠르게 답변해 드립니다. 작성 중인 메모에 대해 질문하거나 위의 빠른 실행 버튼을 눌러보세요!</div>
      </div>

      <div class="ai-footer">
        <div class="context-toggle">
          <label>
            <input id="includeMemoCheck" type="checkbox" checked />
            현재 메모 내용을 AI에게 함께 전달
          </label>
          <button id="clearChatBtn" class="btn-ghost" style="padding: 2px 8px; font-size: 0.74rem;">대화 비우기</button>
        </div>
        <div class="chat-input-row">
          <textarea id="chatInput" class="chat-input" placeholder="메시지 입력 (Enter 전송, Shift+Enter 줄바꿈)"></textarea>
          <button id="sendBtn" class="btn-send">전송</button>
        </div>
      </div>
    </aside>
  </main>

  <!-- 보안 설정 안내 모달 -->
  <div id="securityModal" class="modal-backdrop">
    <div class="modal">
      <h3>🔒 API 키 보안 설정 (Gemini & ChatGPT)</h3>
      <p>
        입력하신 API 키는 서버의 <code>.env</code> 파일에만 안전하게 보관되며 브라우저(HTML/F12)에 절대 노출되지 않습니다. <strong>둘 중 하나만 입력해도 바로 사용할 수 있습니다.</strong>
      </p>

      <div class="modal-field">
        <label for="geminiKeyInput">
          🔵 Google Gemini API 키 <span id="geminiStatusBadge" style="font-weight:normal; color:#64748b;">(미등록)</span>
        </label>
        <div style="display: flex; gap: 6px;">
          <input
            id="geminiKeyInput"
            type="password"
            autocomplete="off"
            placeholder="AIzaSy... 로 시작하는 구글 API 키"
          />
          <button id="toggleGeminiVisBtn" type="button" class="btn-ghost" style="white-space: nowrap;">👁️ 보기</button>
        </div>
      </div>

      <div class="modal-field">
        <label for="openaiKeyInput">
          🟢 OpenAI ChatGPT API 키 <span id="openaiStatusBadge" style="font-weight:normal; color:#64748b;">(미등록)</span>
        </label>
        <div style="display: flex; gap: 6px;">
          <input
            id="openaiKeyInput"
            type="password"
            autocomplete="off"
            placeholder="sk-... 로 시작하는 챗지피티 API 키"
          />
          <button id="toggleOpenaiVisBtn" type="button" class="btn-ghost" style="white-space: nowrap;">👁️ 보기</button>
        </div>
        <div id="keyErrorMsg" style="color: #ef4444; font-size: 0.78rem; margin-top: 8px; display: none;"></div>
      </div>

      <div class="modal-actions">
        <button id="closeModalBtn" class="btn-ghost">닫기</button>
        <button id="saveSessionKeyBtn" class="btn-primary">안전하게 저장 및 적용</button>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // 1. 보안 상태 관리 (Gemini & ChatGPT 듀얼 지원)
    // =========================================================================
    let serverProxyReady = false;
    let volatileGeminiKey = '';
    let volatileOpenaiKey = '';

    const securityBtn = document.getElementById('securityBtn');
    const securityText = document.getElementById('securityText');
    const securityModal = document.getElementById('securityModal');
    const geminiKeyInput = document.getElementById('geminiKeyInput');
    const openaiKeyInput = document.getElementById('openaiKeyInput');
    const geminiStatusBadge = document.getElementById('geminiStatusBadge');
    const openaiStatusBadge = document.getElementById('openaiStatusBadge');
    const keyErrorMsg = document.getElementById('keyErrorMsg');
    const modelSelect = document.getElementById('modelSelect');

    function setupVisToggle(btnId, inputEl) {
      const btn = document.getElementById(btnId);
      btn.addEventListener('click', () => {
        if (inputEl.type === 'password') {
          inputEl.type = 'text';
          btn.textContent = '🙈 숨기기';
        } else {
          inputEl.type = 'password';
          btn.textContent = '👁️ 보기';
        }
      });
    }
    setupVisToggle('toggleGeminiVisBtn', geminiKeyInput);
    setupVisToggle('toggleOpenaiVisBtn', openaiKeyInput);

    function extractValidKey(raw) {
      if (!raw) return '';
      const trimmed = raw.trim();
      const geminiMatch = trimmed.match(/AIza[0-9A-Za-z_-]{30,50}/);
      if (geminiMatch) return geminiMatch[0];
      const openaiMatch = trimmed.match(/sk-[0-9A-Za-z_-]{20,250}/);
      if (openaiMatch) return openaiMatch[0];
      if (/^[\x21-\x7E]{20,}$/.test(trimmed)) return trimmed;
      return '';
    }

    async function checkBackendSecurityStatus() {
      try {
        const res = await fetch('/api/status');
        if (!res.ok) throw new Error('No backend');
        const data = await res.json();

        geminiStatusBadge.textContent = data.geminiConfigured ? '✅ 서버 등록됨' : '(미등록)';
        geminiStatusBadge.style.color = data.geminiConfigured ? '#047857' : '#64748b';
        openaiStatusBadge.textContent = data.openaiConfigured ? '✅ 서버 등록됨' : '(미등록)';
        openaiStatusBadge.style.color = data.openaiConfigured ? '#047857' : '#64748b';

        if (data.configured) {
          serverProxyReady = true;
          securityBtn.classList.remove('warn');
          const activeProviders = [];
          if (data.geminiConfigured) activeProviders.push('Gemini');
          if (data.openaiConfigured) activeProviders.push('ChatGPT');
          securityText.textContent = `보안 연결됨 (${activeProviders.join(' · ')})`;

          // 등록된 키에 맞춰 기본 모델 자동 선택
          if (!data.geminiConfigured && data.openaiConfigured && modelSelect.value.startsWith('gemini-')) {
            modelSelect.value = 'gpt-4o-mini';
          } else if (data.geminiConfigured && !data.openaiConfigured && modelSelect.value.startsWith('gpt-')) {
            modelSelect.value = 'gemini-3.5-flash-lite';
          }
        } else {
          serverProxyReady = false;
          securityBtn.classList.add('warn');
          securityText.textContent = 'API 키 설정 필요 (클릭)';
        }
      } catch {
        serverProxyReady = false;
        if (volatileGeminiKey || volatileOpenaiKey) {
          securityBtn.classList.remove('warn');
          securityText.textContent = '일회성 메모리 키 사용 중';
        } else {
          securityBtn.classList.add('warn');
          securityText.textContent = '보안 연결 설정 필요 (클릭)';
        }
      }
    }

    securityBtn.addEventListener('click', () => {
      geminiKeyInput.value = '';
      openaiKeyInput.value = '';
      keyErrorMsg.style.display = 'none';
      securityModal.classList.add('open');
      geminiKeyInput.focus();
    });

    document.getElementById('closeModalBtn').addEventListener('click', () => {
      securityModal.classList.remove('open');
    });

    document.getElementById('saveSessionKeyBtn').addEventListener('click', async () => {
      const rawG = geminiKeyInput.value.trim();
      const rawO = openaiKeyInput.value.trim();
      const cleanG = extractValidKey(rawG);
      const cleanO = extractValidKey(rawO);

      if (!rawG && !rawO) {
        keyErrorMsg.textContent = '⚠️ Gemini 키(AIza...) 또는 ChatGPT 키(sk-...) 중 하나 이상을 입력해주세요.';
        keyErrorMsg.style.display = 'block';
        return;
      }

      if ((rawG && !cleanG) || (rawO && !cleanO)) {
        keyErrorMsg.textContent =
          '⚠️ 한글이나 일반 문구가 입력되었습니다. 영문/숫자로 된 실제 API 키(AIza... 또는 sk-...)를 붙여넣어 주세요!';
        keyErrorMsg.style.display = 'block';
        return;
      }
      keyErrorMsg.style.display = 'none';

      try {
        const res = await fetch('/api/save-key', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ geminiKey: cleanG, openaiKey: cleanO }),
        });
        const data = await res.json();
        if (res.ok) {
          geminiKeyInput.value = '';
          openaiKeyInput.value = '';
          securityModal.classList.remove('open');
          await checkBackendSecurityStatus();
          return;
        } else {
          keyErrorMsg.textContent = data.error || '저장 실패';
          keyErrorMsg.style.display = 'block';
          return;
        }
      } catch {
        // 서버 없이 단독 실행 중인 경우
        if (cleanG.startsWith('sk-')) volatileOpenaiKey = cleanG;
        else if (cleanG) volatileGeminiKey = cleanG;
        if (cleanO.startsWith('AIza')) volatileGeminiKey = cleanO;
        else if (cleanO) volatileOpenaiKey = cleanO;
        geminiKeyInput.value = '';
        openaiKeyInput.value = '';
        securityModal.classList.remove('open');
        checkBackendSecurityStatus();
      }
    });

    // =========================================================================
    // 2. 메모장 기능 (생성, 수정, 검색, 상단 고정, 삭제, 내보내기)
    // =========================================================================
    const STORAGE_KEY = 'smart_memo_app_items_v1';
    let memos = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null') || [
      {
        id: Date.now().toString(),
        title: '환영합니다! 첫 번째 스마트 메모 ✨',
        content:
          '이 앱은 작성한 메모를 브라우저에 자동 저장하며, 오른쪽의 Gemini 3.5 Flash AI와 대화하며 메모를 발전시킬 수 있습니다.\n\n- 핵심 요약 요청하기\n- 자연스러운 문장으로 다듬기\n- 브레인스토밍 및 할 일(To-Do) 추출하기',
        pinned: true,
        updatedAt: new Date().toISOString(),
      },
    ];
    let activeMemoId = memos[0]?.id || null;

    const memoListEl = document.getElementById('memoList');
    const memoTitleEl = document.getElementById('memoTitle');
    const memoContentEl = document.getElementById('memoContent');
    const searchInputEl = document.getElementById('searchInput');
    const editorStatusEl = document.getElementById('editorStatus');
    const pinMemoBtn = document.getElementById('pinMemoBtn');

    function saveMemosToStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(memos));
      const now = new Date().toLocaleTimeString('ko-KR', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
      });
      editorStatusEl.textContent = `자동 저장됨 (${now}) · ${memoContentEl.value.length}자`;
    }

    function getActiveMemo() {
      return memos.find((m) => m.id === activeMemoId) || null;
    }

    function renderMemoList() {
      const query = searchInputEl.value.trim().toLowerCase();
      const sorted = [...memos].sort((a, b) => {
        if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
        return new Date(b.updatedAt) - new Date(a.updatedAt);
      });

      const filtered = sorted.filter(
        (m) =>
          m.title.toLowerCase().includes(query) ||
          m.content.toLowerCase().includes(query)
      );

      memoListEl.innerHTML = '';
      filtered.forEach((m) => {
        const div = document.createElement('div');
        div.className = `memo-item ${m.id === activeMemoId ? 'active' : ''}`;
        const dateStr = new Date(m.updatedAt).toLocaleString('ko-KR', {
          month: 'short',
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit',
        });

        const headerDiv = document.createElement('div');
        headerDiv.className = 'memo-item-header';
        const titleSpan = document.createElement('span');
        titleSpan.className = 'memo-item-title';
        titleSpan.textContent = (m.pinned ? '📌 ' : '') + (m.title || '제목 없음');
        headerDiv.appendChild(titleSpan);

        const previewDiv = document.createElement('div');
        previewDiv.className = 'memo-item-preview';
        previewDiv.textContent = m.content || '내용 없음';

        const dateDiv = document.createElement('div');
        dateDiv.className = 'memo-item-date';
        dateDiv.textContent = dateStr;

        div.appendChild(headerDiv);
        div.appendChild(previewDiv);
        div.appendChild(dateDiv);

        div.addEventListener('click', () => {
          activeMemoId = m.id;
          loadActiveMemoToEditor();
          renderMemoList();
        });
        memoListEl.appendChild(div);
      });
    }

    function loadActiveMemoToEditor() {
      const current = getActiveMemo();
      if (!current) {
        memoTitleEl.value = '';
        memoContentEl.value = '';
        memoTitleEl.disabled = true;
        memoContentEl.disabled = true;
        return;
      }
      memoTitleEl.disabled = false;
      memoContentEl.disabled = false;
      memoTitleEl.value = current.title;
      memoContentEl.value = current.content;
      pinMemoBtn.textContent = current.pinned ? '📌 고정 해제' : '📌 고정';
      editorStatusEl.textContent = `글자 수: ${current.content.length}자`;
    }

    memoTitleEl.addEventListener('input', () => {
      const current = getActiveMemo();
      if (!current) return;
      current.title = memoTitleEl.value;
      current.updatedAt = new Date().toISOString();
      saveMemosToStorage();
      renderMemoList();
    });

    memoContentEl.addEventListener('input', () => {
      const current = getActiveMemo();
      if (!current) return;
      current.content = memoContentEl.value;
      current.updatedAt = new Date().toISOString();
      saveMemosToStorage();
      renderMemoList();
    });

    document.getElementById('newMemoBtn').addEventListener('click', () => {
      const newMemo = {
        id: Date.now().toString(),
        title: '',
        content: '',
        pinned: false,
        updatedAt: new Date().toISOString(),
      };
      memos.unshift(newMemo);
      activeMemoId = newMemo.id;
      saveMemosToStorage();
      loadActiveMemoToEditor();
      renderMemoList();
      memoTitleEl.focus();
    });

    pinMemoBtn.addEventListener('click', () => {
      const current = getActiveMemo();
      if (!current) return;
      current.pinned = !current.pinned;
      saveMemosToStorage();
      loadActiveMemoToEditor();
      renderMemoList();
    });

    document.getElementById('deleteMemoBtn').addEventListener('click', () => {
      const current = getActiveMemo();
      if (!current) return;
      if (!confirm('현재 메모를 삭제하시겠습니까?')) return;
      memos = memos.filter((m) => m.id !== current.id);
      if (memos.length === 0) {
        memos.push({
          id: Date.now().toString(),
          title: '',
          content: '',
          pinned: false,
          updatedAt: new Date().toISOString(),
        });
      }
      activeMemoId = memos[0].id;
      saveMemosToStorage();
      loadActiveMemoToEditor();
      renderMemoList();
    });

    document.getElementById('exportMemoBtn').addEventListener('click', () => {
      const current = getActiveMemo();
      if (!current) return;
      const blob = new Blob(
        [`# ${current.title || '제목 없음'}\n\n${current.content}`],
        { type: 'text/plain;charset=utf-8' }
      );
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${(current.title || 'memo').replace(/[\\/:*?"<>|]/g, '_')}.txt`;
      a.click();
      URL.revokeObjectURL(a.href);
    });

    searchInputEl.addEventListener('input', renderMemoList);

    // =========================================================================
    // 3. Gemini 3.5 Flash & ChatGPT 대화 기능
    // =========================================================================
    let chatHistory = [];
    const chatMessagesEl = document.getElementById('chatMessages');
    const chatInputEl = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const includeMemoCheck = document.getElementById('includeMemoCheck');

    function appendMessage(role, text, allowInsert = false) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `msg ${role}`;
      const textNode = document.createElement('div');
      textNode.textContent = text;
      msgDiv.appendChild(textNode);

      if (role === 'ai' && allowInsert) {
        const actionsDiv = document.createElement('div');
        actionsDiv.className = 'msg-actions';
        const insertBtn = document.createElement('button');
        insertBtn.className = 'btn-insert';
        insertBtn.textContent = '📝 현재 메모에 추가';
        insertBtn.addEventListener('click', () => {
          const current = getActiveMemo();
          if (!current) return;
          current.content = current.content
            ? `${current.content}\n\n---\n${text}`
            : text;
          current.updatedAt = new Date().toISOString();
          loadActiveMemoToEditor();
          saveMemosToStorage();
          renderMemoList();
          insertBtn.textContent = '✅ 추가 완료!';
          setTimeout(() => {
            insertBtn.textContent = '📝 현재 메모에 추가';
          }, 1500);
        });
        actionsDiv.appendChild(insertBtn);
        msgDiv.appendChild(actionsDiv);
      }

      chatMessagesEl.appendChild(msgDiv);
      chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
      return msgDiv;
    }

    async function sendChatMessage(customText) {
      const text = (customText ?? chatInputEl.value).trim();
      if (!text) return;

      if (!customText) chatInputEl.value = '';
      appendMessage('user', text);
      sendBtn.disabled = true;

      const selectedModel = modelSelect.value;
      const isOpenAI = selectedModel.startsWith('gpt-');
      const providerLabel = isOpenAI ? `ChatGPT (${selectedModel})` : `Gemini (${selectedModel})`;
      const loadingEl = appendMessage('ai', `${providerLabel}가 답변을 작성하고 있습니다...`);
      const currentMemo = getActiveMemo();
      const memoContext =
        includeMemoCheck.checked && currentMemo
          ? { title: currentMemo.title, content: currentMemo.content }
          : null;

      try {
        let replyText = '';

        if (serverProxyReady || (!volatileGeminiKey && !volatileOpenaiKey)) {
          // 1순위: 백엔드 보안 프록시(/api/chat) 호출 — 브라우저에 API 키가 전혀 존재하지 않음
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              history: chatHistory,
              message: text,
              memoContext,
              model: selectedModel,
            }),
          });
          const data = await res.json();
          if (!res.ok) {
            throw new Error(data.error || '서버 응답 오류');
          }
          replyText = data.reply;
          if (data.model && data.model !== selectedModel && [...modelSelect.options].some(o => o.value === data.model)) {
            modelSelect.value = data.model;
          }
        } else {
          // 2순위: 서버 없이 단독 실행 시 일회성 메모리 키로 호출
          const systemInstruction = memoContext
            ? `당신은 스마트 메모 앱에 내장된 AI 어시스턴트입니다.\n[현재 메모]\n제목: ${memoContext.title || '(제목 없음)'}\n내용:\n${memoContext.content || '(내용 없음)'}`
            : '당신은 스마트 메모 앱에 내장된 AI 어시스턴트입니다.';

          if (isOpenAI) {
            if (!volatileOpenaiKey) throw new Error('ChatGPT API 키(sk-...)가 설정되지 않았습니다.');
            const res = await fetch('https://api.openai.com/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                Authorization: `Bearer ${volatileOpenaiKey}`,
              },
              body: JSON.stringify({
                model: selectedModel,
                messages: [
                  { role: 'system', content: systemInstruction },
                  ...chatHistory.map((m) => ({
                    role: m.role === 'ai' ? 'assistant' : 'user',
                    content: m.text,
                  })),
                  { role: 'user', content: text },
                ],
              }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data?.error?.message || `OpenAI API 오류 (${res.status})`);
            replyText = data?.choices?.[0]?.message?.content || '응답을 생성하지 못했습니다.';
          } else {
            if (!volatileGeminiKey) throw new Error('Gemini API 키(AIza...)가 설정되지 않았습니다.');
            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(
              selectedModel
            )}:generateContent`;
            const res = await fetch(endpoint, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'x-goog-api-key': volatileGeminiKey,
              },
              body: JSON.stringify({
                systemInstruction: { parts: [{ text: systemInstruction }] },
                contents: [
                  ...chatHistory.map((m) => ({
                    role: m.role === 'ai' ? 'model' : 'user',
                    parts: [{ text: m.text }],
                  })),
                  { role: 'user', parts: [{ text }] },
                ],
              }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data?.error?.message || `Gemini API 오류 (${res.status})`);
            replyText =
              data?.candidates?.[0]?.content?.parts?.map((p) => p.text).join('') ||
              '응답을 생성하지 못했습니다.';
          }
        }

        loadingEl.remove();
        appendMessage('ai', replyText, true);
        chatHistory.push({ role: 'user', text });
        chatHistory.push({ role: 'ai', text: replyText });
      } catch (err) {
        loadingEl.remove();
        appendMessage(
          'ai',
          `⚠️ 오류: ${err.message}\n(우측 상단 '🔒 보안 상태' 버튼을 눌러 .env 설정 방법이나 API 키 설정을 확인해주세요.)`
        );
      } finally {
        sendBtn.disabled = false;
        chatInputEl.focus();
      }
    }

    sendBtn.addEventListener('click', () => sendChatMessage());
    chatInputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendChatMessage();
      }
    });

    document.querySelectorAll('.chip').forEach((btn) => {
      btn.addEventListener('click', () => {
        sendChatMessage(btn.getAttribute('data-prompt'));
      });
    });

    document.getElementById('clearChatBtn').addEventListener('click', () => {
      chatHistory = [];
      chatMessagesEl.innerHTML = '';
      appendMessage('ai', '대화 내역이 초기화되었습니다. 무엇을 도와드릴까요?');
    });

    // 초기화 실행
    loadActiveMemoToEditor();
    renderMemoList();
    checkBackendSecurityStatus();
  </script>
</body>
</html>
